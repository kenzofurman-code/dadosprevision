version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dadosprevision-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dadosprevision}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_seguro_123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dadosprevision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dadosprevision-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_seguro_123}@postgres:5432/${POSTGRES_DB:-dadosprevision}
      PREVISION_API_KEY: ${PREVISION_API_KEY}
      PREVISION_REST_TOKEN: ${PREVISION_REST_TOKEN:-}
      CRON_SYNC_SCHEDULE: ${CRON_SYNC_SCHEDULE:-0 6,18 * * *}
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
