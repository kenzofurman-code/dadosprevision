services:
  postgres:
    image: postgres:16-alpine
    container_name: dadosprevision-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dadosprevision}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dadosprevision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dadosprevision-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dadosprevision}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      PREVISION_API_KEY: ${PREVISION_API_KEY}
      PREVISION_REST_TOKEN: ${PREVISION_REST_TOKEN:-}
      CRON_SYNC_SCHEDULE: ${CRON_SYNC_SCHEDULE:-0 6,18 * * *}
    ports:
      - "3000:3000"

  mega:
    build: ./mega
    container_name: dadosprevision-mega
    restart: always
    # OBRIGATORIO: sem init, xvfb-run roda como PID 1 e trava para sempre —
    # o mecanismo de "Xvfb pronto" dele depende de receber SIGUSR1, entrega
    # que falha para processos PID 1 sem um init de verdade. Confirmado ao
    # vivo: o container ficou parado indefinidamente sem isso, e funcionou na
    # hora com "docker run --init" (mesmo efeito de "init: true" aqui).
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dadosprevision}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      MEGA_USUARIO: ${MEGA_USUARIO:?defina MEGA_USUARIO no arquivo .env}
      MEGA_SENHA: ${MEGA_SENHA:?defina MEGA_SENHA no arquivo .env}
      CRON_SCHEDULE_MEGA: ${CRON_SCHEDULE_MEGA:-0 2 * * *}
    volumes:
      - mega_dados:/app/dados   # so para BLOQUEADO reter evidencia

volumes:
  pgdata:
    driver: local
  mega_dados:
    driver: local
