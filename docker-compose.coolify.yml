services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dadosprevision}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no Coolify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dadosprevision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      TZ: ${TZ:-America/Sao_Paulo}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dadosprevision}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no Coolify}
      PREVISION_API_KEY: ${PREVISION_API_KEY}
      PREVISION_REST_TOKEN: ${PREVISION_REST_TOKEN:-}
      CRON_SYNC_SCHEDULE: ${CRON_SYNC_SCHEDULE:-0 6,18 * * *}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mega:
    build: ./mega
    restart: always
    # OBRIGATORIO: sem init, xvfb-run roda como PID 1 e trava para sempre —
    # o mecanismo de "Xvfb pronto" dele depende de receber SIGUSR1, entrega
    # que falha para processos PID 1 sem um init de verdade. Confirmado ao
    # vivo contra uma VPS Linux real em 2026-09-08.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dadosprevision}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no Coolify}
      MEGA_USUARIO: ${MEGA_USUARIO:?defina MEGA_USUARIO no Coolify}
      MEGA_SENHA: ${MEGA_SENHA:?defina MEGA_SENHA no Coolify}
      CRON_SCHEDULE_MEGA: ${CRON_SCHEDULE_MEGA:-0 2 * * *}
    volumes:
      - mega_dados:/app/dados   # so para BLOQUEADO reter evidencia

volumes:
  pgdata:
    driver: local
  mega_dados:
    driver: local
